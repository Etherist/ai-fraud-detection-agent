[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fraud-detection-agent"
version = "1.0.0"
description = "AI Fraud Detection Agent for SME Loans - Automated fraud & AML risk assessment for Australian lenders"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "AI Fraud Detection Team", email = "contact@example.com"}
]
keywords = [
    "fraud-detection",
    "AML",
    "APRA",
    "SME-loans",
    "machine-learning",
    "fastapi",
    "pyod",
    "isolation-forest",
    "agent-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pandas==2.1.3",
    "numpy==1.24.3",
    "pytesseract==0.3.10",
    "PyPDF2==3.0.1",
    "pyod==1.0.7",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "jinja2==3.1.2",
    "reportlab==4.0.7",
    "matplotlib==3.7.2",
    "spacy==3.7.2",
    "pdf2image==1.16.3",  # Optional: for better PDF OCR
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.6.1",
    "safety==2.3.5",
    "httpx==0.25.0",  # for async tests
]

docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.4.0",
]

all = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.6.1",
    "safety==2.3.5",
]

[project.scripts]
fraud-detection-cli = "src.app.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/ai-fraud-detection-sme"
Documentation = "https://your-username.github.io/ai-fraud-detection-sme/"
Repository = "https://github.com/your-username/ai-fraud-detection-sme.git"
Issues = "https://github.com/your-username/ai-fraud-detection-sme/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "pdf2image.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
]
